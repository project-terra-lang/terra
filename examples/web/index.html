<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Terra FFI Webserver</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f7f7f2;
        color: #172026;
      }
      main {
        max-width: 42rem;
        padding: 3rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2.5rem;
      }
      p {
        font-size: 1.125rem;
        line-height: 1.6;
      }
      code {
        background: #e7ecef;
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Terra</h1>
      <p>
        This page is served by Erlang/OTP <code>inets:httpd</code>, started from
        Terra through explicit checked FFI declarations.
      </p>
    </main>
  </body>
</html>
